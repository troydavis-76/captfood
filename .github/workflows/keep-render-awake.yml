name: Garder le backend Render éveillé

on:
  schedule:
    # Toutes les 10 minutes. GitHub ne garantit pas une exécution pile à l'heure
    # (ça peut être décalé de quelques minutes en cas de forte charge côté GitHub),
    # mais ça reste largement sous le seuil de mise en veille de Render (15 min).
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sf https://click-halal.onrender.com/health || echo "Ping échoué (le backend était peut-être déjà en train de se réveiller)"
